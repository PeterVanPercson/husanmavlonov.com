<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>404 — Husan Mavlonov</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#16181c" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="preload" as="image" href="/sky/aida.png">
  <link rel="preload" as="image" type="image/webp" href="/sky/orca.webp">
  <link rel="preload" as="image" type="image/webp" href="/sky/cloud-1.webp">
  <link rel="preload" as="image" type="image/webp" href="/sky/cloud-2.webp">
  <link rel="preload" as="image" type="image/webp" href="/sky/cloud-3.webp" media="(min-width: 700.01px)">
  <link rel="preload" href="/fonts/inter-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/jetbrainsmono-400.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:optional;src:url(/fonts/inter-400.woff2) format('woff2')}
    @font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:optional;src:url(/fonts/inter-500.woff2) format('woff2')}
    @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:optional;src:url(/fonts/jetbrainsmono-400.woff2) format('woff2')}
    @font-face{font-family:'Newsreader';font-style:normal;font-weight:400 500;font-display:optional;src:url(/fonts/newsreader-latin.woff2) format('woff2')}
    @font-face{font-family:'Serif Fallback';src:local('Iowan Old Style'),local('Georgia');size-adjust:94%;ascent-override:98%;descent-override:26%;line-gap-override:0%}
    @font-face{font-family:'Sans Fallback';src:local('Arial'),local('Helvetica Neue');size-adjust:105%;ascent-override:97%;descent-override:24%;line-gap-override:0%}
    @font-face{font-family:'Mono Fallback';src:local('Menlo'),local('Consolas');size-adjust:110%;ascent-override:102%;descent-override:30%;line-gap-override:0%}
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #16181c; --fg: #e8e6df; --dim: #908b83; --accent: #a8aeb4;
      --mono: 'JetBrains Mono', 'Mono Fallback', ui-monospace, Menlo, monospace;
      --sans: 'Inter', 'Sans Fallback', system-ui, -apple-system, sans-serif;
      --display: 'Newsreader', 'Serif Fallback', 'Iowan Old Style', Georgia, serif;
    }
    body.light {
      --bg: #a8aeb4; --fg: #16181c; --dim: #383a3e; --accent: #2a2f36;
    }
    html, body {
      background: var(--bg); color: var(--fg);
      font-family: var(--sans);
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    main {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center; justify-content: center;
      padding: 40px 24px;
    }
    /* the copy needs a pane of its own — on this page there is no other chrome between
       the type and the photograph */
    .n4-card {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px;
      padding: 44px 40px 40px;
      border-radius: 18px;
      max-width: 560px;
      text-align: center;
    }
    .code {
      font-family: var(--mono); font-size: 12px;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      font-family: var(--display); font-weight: 400;
      font-size: clamp(40px, 9vw, 84px);
      line-height: 1; letter-spacing: -0.012em;
    }
    h1 em { color: var(--accent); font-style: normal; }
    p {
      font-family: var(--display); font-size: clamp(17px, 2.4vw, 21px);
      color: var(--dim); max-width: 30ch;
    }
    a.home {
      margin-top: 10px;
      font-family: var(--mono); font-size: 11px;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--dim); text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 3px;
      transition: color 0.2s ease;
    }
    a.home:hover { color: var(--fg); }
  </style>
  <!-- shared SF backdrop + glass material; loaded LAST so it wins over the inline styles -->
  <link rel="stylesheet" href="/glass.css?v=6">
</head>
<body>
<script>/* pre-paint: apply saved theme + skip the backdrop fade after the first load,
   so navigating between pages never re-flashes the (identical) backdrop */
try{var t=localStorage.getItem('hm-theme');if(t==='light'||(!t&&matchMedia('(prefers-color-scheme: light)').matches))document.body.classList.add('light');if(sessionStorage.getItem('hm-bg'))document.documentElement.classList.add('bg-instant');else sessionStorage.setItem('hm-bg','1')}catch(e){}</script>
  <!-- shared SF backdrop — decorative; identical markup on every page -->
  <div class="bg-plate" aria-hidden="true"></div>
  <div class="bg-clouds" aria-hidden="true">
    <div class="cloud-p cp-1" data-depth="0.10"><img class="c-sky" src="/sky/cloud-1.webp" alt="" width="1240" height="780" decoding="sync"><img class="c-stitch" src="/sky/orca.webp" alt="" width="582" height="640" decoding="sync"></div>
    <div class="cloud-p cp-2" data-depth="0.05"><img class="c-sky" src="/sky/cloud-2.webp" alt="" width="1180" height="720" decoding="sync"><img class="c-stitch" src="/sky/orca.webp" alt="" width="582" height="640" decoding="sync"></div>
    <div class="cloud-p cp-3" data-depth="0.16"><img class="c-sky" src="/sky/cloud-3.webp" alt="" width="820" height="520" decoding="sync"><img class="c-stitch" src="/sky/orca.webp" alt="" width="582" height="640" decoding="sync"></div>
  </div>
  <script>/* pre-paint: clock-anchored drift phase - same drifter position on every page */
  try{document.querySelectorAll('.cloud-p img').forEach(function(g){var d=parseFloat(getComputedStyle(g).animationDuration)||160;g.style.animationDelay=(-(Date.now()/1e3%(2*d))).toFixed(1)+'s'})}catch(e){}</script>
  <div class="bg-scrim" aria-hidden="true"></div>
  <main>
    <div class="n4-card glass">
      <span class="code">404 · not found</span>
      <h1>Husan Mavlonov<em>.</em></h1>
      <p>lost the thread. nothing lives at this address.</p>
      <a class="home" href="/"><i class="arw">←</i> back to start</a>
    </div>
  </main>
  <script>
    // match the other pages: restore the saved theme before the backdrop settles
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('hm-theme'); } catch (e) {}
      var light = saved ? saved === 'light'
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
      if (light) {
        document.body.classList.add('light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#a8aeb4');
      }
    })();

    // fade the shared backdrop in on decode
    (function () {
      const plate = document.querySelector('.bg-plate');
      if (!plate) return;
      const ready = () => document.body.classList.add('bg-ready');
      const src = getComputedStyle(plate).backgroundImage.match(/url\(["']?([^"')]+)["']?\)/);
      if (!src) { ready(); return; }
      const img = new Image();
      img.onload = img.onerror = ready;
      img.src = src[1];
      if (img.complete) ready();
    })();
  </script>
<script src="/sky.js?v=6" defer></script>
</body>
</html>
