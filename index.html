    /* Stripped to the bone on purpose: name, one line, socials. The backdrop and
       the ink tokens live in /glass.css — this file only sets the base palette
       (which glass.css overrides inside .glass) and lays out three elements. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #16181c;
      --fg: #e8e6df;
      --dim: #908b83;
      --dimmer: #3a3835;
      --accent: #a8aeb4;
      --mono: 'JetBrains Mono', 'Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: 'Inter', 'Sans Fallback', system-ui, -apple-system, sans-serif;
      --display: 'Newsreader', 'Serif Fallback', 'Iowan Old Style', Georgia, serif;
    }
    body.light {
      --bg: #a8aeb4; --fg: #16181c; --dim: #383a3e; --dimmer: #6a6c70; --accent: #2a2f36;
    }

    html, body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background 0.4s ease, color 0.4s ease;
    }
    ::selection { background: var(--accent); color: var(--bg); }

    .page {
      max-width: 720px;
      margin: 26px auto 46px;
      padding: 34px 38px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 2;
      border-radius: 18px;
    }

    h1 {
      font-family: var(--display);
      font-size: clamp(38px, 5.8vw, 64px);
      font-weight: 400;
      letter-spacing: -0.012em;
      line-height: 1.02;
      color: var(--fg);
      transition: color 0.4s ease;
    }
    h1 em { font-style: normal; color: var(--accent); font-weight: 400; }

    .meta-line {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--dim);
      line-height: 1.6;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 8px;
      margin-top: -2px;
    }
    .meta-line > span { white-space: nowrap; }
    .sep { color: var(--dimmer); }

    /* Powell.st — the one link in the meta line, so it needs to read as one.
       Colour-only transition: Chromium keeps a stale var() on a border-color
       that is mid-transition, which left the other theme's tint after a toggle. */
    .meta-line a.powell {
      color: var(--fg);
      border-bottom: 1px solid var(--dimmer);
      padding-bottom: 1px;
      transition: color 0.2s ease;
    }
    .meta-line a.powell:hover { color: var(--accent); border-bottom-color: var(--accent); }

    .socials {
      margin-top: 12px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.6;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 8px;
      color: var(--dimmer);
    }
    .socials a {
      color: var(--dimmer);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .socials a:hover { color: var(--fg); }
    /* the telegram caveat rides along at the same size, one step quieter */
    .socials .note { opacity: 0.72; }

    /* telegram request — a two-field form, same mono voice as everything else */
    .tg-form {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 10px;
      font-family: var(--mono);
      font-size: 12px;
    }
    .tg-form input {
      font: inherit;
      color: var(--fg);
      background: none;
      border: 0;
      border-bottom: 1px solid var(--dimmer);
      padding: 3px 2px;
      width: 148px;
      border-radius: 0;
    }
    .tg-form input::placeholder { color: var(--dimmer); }
    .tg-form input:focus {
      outline: none;
      border-bottom-color: var(--fg);
    }
    .tg-form button {
      font: inherit;
      color: var(--fg);
      background: none;
      border: 1px solid var(--dimmer);
      border-radius: 999px;
      padding: 4px 12px;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .tg-form button:hover { border-color: var(--fg); }
    .tg-form input:focus-visible, .tg-form button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .tg-msg { color: var(--dimmer); }
    .tg-msg.ok { color: var(--fg); }

    /* wallpaper switch — the two versions, named the way he names them */
    .wallpaper {
      margin-top: 10px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
      display: flex;
      align-items: baseline;
      gap: 8px;
      color: var(--dimmer);
    }
    .wallpaper button {
      font: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      color: var(--dimmer);
      transition: color 0.2s ease;
    }
    .wallpaper button:hover { color: var(--fg); }
    .wallpaper button.on {
      color: var(--fg);
      border-bottom: 1px solid var(--dimmer);
      padding-bottom: 1px;
    }
    .wallpaper button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    a:focus-visible, .socials a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    @media (max-width: 700px) {
      .page { margin: 14px auto 30px; padding: 26px 20px 24px; border-radius: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html, body, h1, .meta-line a.powell, .socials a { transition: none; }
    }

  <script>
  /* WALLPAPER SWITCH — same storage key the pre-paint script reads, so the
     choice survives a reload and there is no flash of the other version. */
  (function () {
    var KEY = 'hm-theme';
    var btns = [].slice.call(document.querySelectorAll('.wallpaper button'));
    if (!btns.length) return;
    var meta = document.querySelector('meta[name="theme-color"]');
    function paint(sky, store) {
      document.body.classList.toggle('light', sky);
      if (meta) meta.setAttribute('content', sky ? '#1266c4' : '#3c4c30');
      if (store) { try { localStorage.setItem(KEY, sky ? 'light' : 'dark'); } catch (e) {} }
      btns.forEach(function (b) {
        var on = (b.getAttribute('data-theme') === 'sky') === sky;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }
    paint(document.body.classList.contains('light'), false);
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        paint(b.getAttribute('data-theme') === 'sky', true);
      });
    });
  })();

  /* TELEGRAM REQUEST — name + email, then ping Husan.
     ENDPOINT: paste a form endpoint (Web3Forms / Formspree) to get a real
     silent email with the name and address in it. Until then the submit falls
     back to opening a pre-filled mail, which still delivers both fields.
     Either way an anonymous counted event lands in analytics. */
  (function () {
    var ENDPOINT = '';                    // e.g. 'https://api.web3forms.com/submit'
    var ACCESS_KEY = '';                  // Web3Forms access key (public by design)
    var TO = 'husanmavlonov79@gmail.com';

    var link = document.getElementById('tgRequest');
    var form = document.getElementById('tgForm');
    var msg  = document.getElementById('tgMsg');
    if (!link || !form) return;

    function ping() {
      if (window.goatcounter && window.goatcounter.count) {
        try {
          window.goatcounter.count({ path: 'telegram-request', title: 'Telegram join request', event: true });
        } catch (e) {}
      }
    }

    link.addEventListener('click', function (e) {
      e.preventDefault();
      var open = form.hidden;
      form.hidden = !open;
      link.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) document.getElementById('tgName').focus();
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var name  = form.name.value.trim();
      var email = form.email.value.trim();
      if (!name || !email) return;
      ping();

      if (ENDPOINT && ACCESS_KEY) {
        msg.textContent = 'sending…';
        fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({
            access_key: ACCESS_KEY,
            subject: 'request to join telegram channel',
            from_name: name,
            name: name,
            email: email
          })
        }).then(function (r) {
          msg.textContent = r.ok ? 'sent — he\'ll add you.' : 'did not send, try email instead.';
          msg.className = 'tg-msg' + (r.ok ? ' ok' : '');
          if (r.ok) form.reset();
        }).catch(function () {
          msg.textContent = 'did not send, try email instead.';
          msg.className = 'tg-msg';
        });
        return;
      }

      // no endpoint configured: hand the same two fields to their mail client
      var body = 'request to join channel%0A%0Aname: ' + encodeURIComponent(name) +
                 '%0Aemail: ' + encodeURIComponent(email) + '%0A';
      window.location.href = 'mailto:' + TO + '?subject=' +
        encodeURIComponent('request to join channel') + '&body=' + body;
      msg.textContent = 'opening your mail…';
      msg.className = 'tg-msg ok';
    });
  })();
  </script>

          async src="//gc.zgo.at/count.js"></script>
<script src="/sky.js?v=6" defer></script>
