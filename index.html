  <style>
    /* Stripped to the bone on purpose: name, one line, socials. The backdrop and
       the ink tokens live in /glass.css — this file only sets the base palette
       (which glass.css overrides inside .glass) and lays out three elements. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #16181c;
      --fg: #e8e6df;
      --dim: #908b83;
      --dimmer: #3a3835;
      --accent: #a8aeb4;
      --mono: 'JetBrains Mono', 'Mono Fallback', ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: 'Inter', 'Sans Fallback', system-ui, -apple-system, sans-serif;
      --display: 'Newsreader', 'Serif Fallback', 'Iowan Old Style', Georgia, serif;
    }
    body.light {
      --bg: #a8aeb4; --fg: #16181c; --dim: #383a3e; --dimmer: #6a6c70; --accent: #2a2f36;
    }

    html, body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background 0.4s ease, color 0.4s ease;
    }
    ::selection { background: var(--accent); color: var(--bg); }

    /* every underline on this page is a border-bottom we draw ourselves */
    a { color: inherit; text-decoration: none; }

    .page {
      max-width: 720px;
      margin: 26px auto 46px;
      padding: 34px 38px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 2;
      border-radius: 18px;
    }

    h1 {
      font-family: var(--display);
      font-size: clamp(38px, 5.8vw, 64px);
      font-weight: 400;
      letter-spacing: -0.012em;
      line-height: 1.02;
      color: var(--fg);
      transition: color 0.4s ease;
    }
    h1 em { font-style: normal; color: var(--accent); font-weight: 400; }

    .meta-line {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--dim);
      line-height: 1.6;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 8px;
      margin-top: -2px;
    }
    .meta-line > span { white-space: nowrap; }
    .sep { color: var(--dimmer); }

    /* Powell.st — the one link in the meta line, so it needs to read as one.
       Colour-only transition: Chromium keeps a stale var() on a border-color
       that is mid-transition, which left the other theme's tint after a toggle. */
    .meta-line a.powell {
      color: var(--fg);
      border-bottom: 1px solid var(--dimmer);
      padding-bottom: 1px;
      transition: color 0.2s ease;
    }
    .meta-line a.powell:hover { color: var(--accent); border-bottom-color: var(--accent); }

    .socials {
      margin-top: 12px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.6;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 8px;
      color: var(--dimmer);
    }
    .socials a {
      color: var(--dimmer);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .socials a:hover { color: var(--fg); }
    /* the telegram caveat rides along at the same size, one step quieter */
    .socials .note { opacity: 0.72; }

    /* telegram request — a small transparent panel over the wallpaper.
       Deliberately light: a thin edge, a little blur so the type stays readable
       on cloth or cloud, and nothing else. */
    .tg-pop[hidden] { display: none; }   /* a display rule beats the hidden attribute */
    .tg-pop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(10, 16, 8, 0.28);
    }
    body.light .tg-pop { background: rgba(6, 30, 62, 0.24); }

    .tg-card {
      /* the panel sits OUTSIDE .page.glass, so it does not inherit the ink
         tokens glass.css defines there — it carries its own light ink, which is
         what a dark translucent card needs in either wallpaper */
      --fg: #f8f7f2;
      --dim: #e9ede4;
      --dimmer: #b6c2ac;
      position: relative;
      width: 100%;
      max-width: 268px;
      padding: 18px 18px 16px;
      border: 1px solid rgba(255, 255, 255, 0.30);
      border-radius: 12px;
      background: rgba(18, 26, 14, 0.42);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--fg);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    body.light .tg-card {
      background: rgba(10, 44, 92, 0.38);
      --dim: #e7ecf4;
      --dimmer: #bccbe0;
    }

    .tg-title { color: var(--dim); letter-spacing: 0.02em; }
    .tg-x {
      position: absolute;
      top: 6px; right: 9px;
      font: inherit;
      font-size: 16px;
      line-height: 1;
      background: none;
      border: 0;
      padding: 2px 4px;
      color: var(--dimmer);
      cursor: pointer;
    }
    .tg-x:hover { color: var(--fg); }

    #tgForm { display: flex; flex-direction: column; gap: 10px; }
    .tg-card .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
    .tg-card input:not(.hp) {
      font: inherit;
      color: var(--fg);
      background: none;
      border: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.32);
      padding: 5px 2px;
      border-radius: 0;
      width: 100%;
    }
    .tg-card input::placeholder { color: var(--dimmer); }
    .tg-card input:focus { outline: none; border-bottom-color: var(--fg); }
    .tg-send {
      font: inherit;
      align-self: flex-start;
      margin-top: 2px;
      color: var(--fg);
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 999px;
      padding: 5px 14px;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }
    .tg-send:hover { border-color: var(--fg); }
    .tg-msg { color: var(--dimmer); min-height: 1em; }
    .tg-msg.ok { color: var(--fg); }
    .tg-card input:focus-visible,
    .tg-send:focus-visible,
    .tg-x:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* wallpaper switch — the two versions, named the way he names them */
    .wallpaper {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 3;
      margin: 0;
      font-family: var(--mono);
      font-size: 11.5px;
      line-height: 1.6;
      display: flex;
      align-items: baseline;
      gap: 7px;
      color: var(--dimmer);
      text-shadow: 0 1px 2px rgba(12, 20, 8, 0.5);
    }
    .wallpaper button {
      font: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      color: var(--dimmer);
      transition: color 0.2s ease;
    }
    .wallpaper button:hover { color: var(--fg); }
    .wallpaper button.on {
      color: var(--fg);
      border-bottom: 1px solid var(--dimmer);
      padding-bottom: 1px;
    }
    .wallpaper button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    a:focus-visible, .socials a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    @media (max-width: 700px) {
      .page { margin: 14px auto 30px; padding: 26px 20px 24px; border-radius: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html, body, h1, .meta-line a.powell, .socials a { transition: none; }
    }
  </style>

  <script>/* SKY BACKDROP — reveal once the plate resolves (dark = aida tile, light = pure
     gradient, so this fires immediately there). Without it the plate and the drifters
     stay at opacity 0 on a first visit. */
  (function () {
    var plate = document.querySelector('.bg-plate');
    if (!plate) return;
    function ready() { document.body.classList.add('bg-ready'); }
    var m = getComputedStyle(plate).backgroundImage.match(/url\(["']?([^"')]+)["']?\)/);
    if (!m) { ready(); return; }
    var img = new Image();
    img.onload = img.onerror = ready;
    img.src = m[1];
    if (img.complete) ready();

        <p class="tg-msg" id="tgMsg" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <script>
  /* WALLPAPER SWITCH — same storage key the pre-paint script reads, so the
     choice survives a reload and there is no flash of the other version. */
  (function () {
    var KEY = 'hm-theme';
    var btns = [].slice.call(document.querySelectorAll('.wallpaper button'));
    if (!btns.length) return;
    var meta = document.querySelector('meta[name="theme-color"]');
    function paint(sky, store) {
      document.body.classList.toggle('light', sky);
      if (meta) meta.setAttribute('content', sky ? '#1266c4' : '#3c4c30');
      if (store) { try { localStorage.setItem(KEY, sky ? 'light' : 'dark'); } catch (e) {} }
      btns.forEach(function (b) {
        var on = (b.getAttribute('data-theme') === 'sky') === sky;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }
    paint(document.body.classList.contains('light'), false);
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        paint(b.getAttribute('data-theme') === 'sky', true);
      });
    });
  })();

  /* TELEGRAM REQUEST — the link opens a small transparent panel; submitting it
     POSTs to Husan's own defex backend (/ping/, locked to this origin), which
     emails him through Resend. Only a real send reports success; anything else
     falls back to a pre-filled mail carrying the same two fields. */
  (function () {
    var ENDPOINT = 'https://defex.app/ping/';
    var TO = 'husanmavlonov79@gmail.com';

    var link  = document.getElementById('tgRequest');
    var pop   = document.getElementById('tgPop');
    var card  = pop && pop.querySelector('.tg-card');
    var form  = document.getElementById('tgForm');
    var msg   = document.getElementById('tgMsg');
    var close = document.getElementById('tgClose');
    if (!link || !pop || !form) return;

    function say(text, ok) {
      msg.textContent = text;
      msg.className = 'tg-msg' + (ok ? ' ok' : '');
    }
    function open() {
      pop.hidden = false;
      link.setAttribute('aria-expanded', 'true');
      say('', false);
      document.getElementById('tgName').focus();
    }
    function shut() {
      pop.hidden = true;
      link.setAttribute('aria-expanded', 'false');
      link.focus();
    }

    link.addEventListener('click', function (e) { e.preventDefault(); open(); });
    close.addEventListener('click', shut);
    pop.addEventListener('mousedown', function (e) { if (!card.contains(e.target)) shut(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !pop.hidden) shut();
    });

    function mailFallback(name, email) {
      window.location.href = 'mailto:' + TO +
        '?subject=' + encodeURIComponent('request to join channel') +
        '&body=' + encodeURIComponent('request to join channel\n\nname: ' + name + '\nemail: ' + email + '\n');
      say('opening your mail…', true);
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var name  = form.name.value.trim();
      var email = form.email.value.trim();
      if (!name) { say('name?', false); return; }
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { say('real email?', false); return; }

      if (window.goatcounter && window.goatcounter.count) {
        try { window.goatcounter.count({ path: 'telegram-request', title: 'Telegram join request', event: true }); } catch (e2) {}
      }

      say('sending…', false);
      fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, email: email, website: form.website.value })
      }).then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          // `sent` is the mail actually leaving, not just the request being accepted
          if (d && d.sent) {
            form.reset();
            say('sent — he\'ll add you.', true);
            setTimeout(shut, 1400);
          } else {
            mailFallback(name, email);
          }
        })
        .catch(function () { mailFallback(name, email); });
    });
  })();
  </script>

  <script data-goatcounter="https://analyze.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
<script src="/sky.js?v=7" defer></script>
</body>
